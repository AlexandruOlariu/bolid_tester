name: CI

# verify       — every push, tag and pull request: lint, typecheck, tests, release-config checks.
# build-android — pushes to main and `v*` tags: release APK + AAB. Release-signed when the keystore
#                 secrets exist (required on tags); a GitHub Release is created only for tags.
# ota-publish  — `v*` tags only: publishes the JS bundle to the EAS Update `production` branch.
# Release procedure, secrets and rollback: docs/release.md.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: we only need types/sources for checks, not native builds.
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Lint (core)
        run: npm run lint
      # docs/adapters/matrix.md, the per-adapter pages and src/shared/adapters/knownAdapters.json are
      # generated from docs/adapters/reports/*.json (plan 29); fail when they were not rebuilt, were
      # edited by hand, or a report is malformed / from the simulator.
      - name: Adapter compatibility matrix is up to date
        run: npm run adapters:check
      - name: Typecheck (core)
        run: npm run typecheck
      - name: Test (core + component)
        run: npm test
      # Community contribution checks (plan 33, CONTRIBUTING.md): vehicle-doc front-matter, replay
      # fixtures, label packs (ids, identical prefixes, DID keys, registration), DTC tables (keys,
      # duplicates across files, License: header), sniffer capture headers, licence hygiene.
      - name: Contribution checks
        run: npm run validate:contrib
      - name: Typecheck (full app)
        run: npm run typecheck:app
      # plugins/withReleaseSigning.js against the generated-gradle fixture + one version everywhere.
      - name: Release config (signing plugin, version sync)
        run: npm run check:release
      # Every palette token meets WCAG AA in both themes (plan 20, docs/accessibility.md).
      - name: Palette contrast
        run: npm run check:contrast
      # Store listing text within the console limits, EN = RO file set, graphic and screenshot sizes
      # (plan 30, store/README.md). Reads PNG headers only, so it needs no image library and runs in
      # well under a second; it runs on every push instead of behind a store/ path filter.
      - name: Store assets
        run: npm run check:store
      # The capture analyzer CLI runs the TypeScript analyzer through Node's type stripping (plan 25);
      # exercise that path on the committed synthetic capture.
      - name: Capture analyzer CLI smoke
        run: npm run check:capture

  build-android:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release on tags
    concurrency:
      group: build-android-${{ github.ref }}
      cancel-in-progress: false
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Full install (scripts enabled) so Expo config plugins are available to prebuild.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag matches the app version
        if: env.IS_TAG == 'true'
        run: node scripts/check-version-sync.mjs --tag "$GITHUB_REF_NAME"
      # Secrets cannot be tested in a step `if:`, so the shell decides. With the secret, the keystore
      # is decoded to the runner's temp dir and BOLID_KEYSTORE_PATH is exported to later steps; the
      # plugin's gradle block then signs with it. Without it a main build stays debug-signed, but a
      # tag build fails here rather than publish a debug-signed release.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
            echo "BOLID_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::Tag build without the ANDROID_KEYSTORE_B64 secret: refusing to publish a debug-signed release. Add the four signing secrets (docs/release.md)."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set, so this build is debug-signed (internal testing only)."
          fi
      # android/ is gitignored, so prebuild regenerates the native project from app.json, running
      # plugins/withReleaseSigning.js (release signingConfig + versionCode = run number).
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          BOLID_VERSION_CODE: ${{ github.run_number }}
      # Opt-in crash reports (plan 31, docs/release.md): source maps upload to Sentry only when the
      # SENTRY_AUTH_TOKEN secret exists; without it the upload is switched off so the build still
      # passes. The DSN is never committed — it reaches the JS bundle from the SENTRY_DSN secret as
      # EXPO_PUBLIC_SENTRY_DSN (empty = the app's reporter stays a no-op).
      - name: Sentry source-map upload switch
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
            echo "SENTRY_AUTH_TOKEN is not set; source maps will not be uploaded."
          fi
      # Gradle caching must come AFTER prebuild — the gradle files don't exist until then.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          BOLID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BOLID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BOLID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      - name: Collect APK + AAB
        id: out
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          aab=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n1)
          if [ -z "$apk" ] || [ -z "$aab" ]; then echo "::error::APK or AAB missing" >&2; exit 1; fi
          mkdir -p dist
          base="dist/bolid-tester-v${{ steps.ver.outputs.version }}-${{ github.run_number }}"
          cp "$apk" "$base.apk"
          cp "$aab" "$base.aab"
          echo "apk=$base.apk" >> "$GITHUB_OUTPUT"
          echo "aab=$base.aab" >> "$GITHUB_OUTPUT"
      - name: Check versionCode and versionName
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$aapt2" dump badging "${{ steps.out.outputs.apk }}" | head -n1 | tee badging.txt
          grep -q "versionCode='${{ github.run_number }}'" badging.txt || { echo "::error::versionCode is not the run number" >&2; exit 1; }
          grep -q "versionName='${{ steps.ver.outputs.version }}'" badging.txt || { echo "::error::versionName is not the app version" >&2; exit 1; }
      - name: Verify release signature
        if: env.BOLID_KEYSTORE_PATH != ''
        run: |
          set -o pipefail
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "${{ steps.out.outputs.apk }}" | tee sig.txt
          # apksigner prints "Signer #1 certificate DN" (older build-tools) or "V2 Signer: certificate DN" (newer).
          grep -qE "(Signer #1|V[0-9]+ Signer:) certificate DN" sig.txt || { echo "::error::apksigner printed no signer certificate" >&2; exit 1; }
          if grep -q "Android Debug" sig.txt; then echo "::error::APK is signed with the debug key" >&2; exit 1; fi
      - name: Upload APK + AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: |
            ${{ steps.out.outputs.apk }}
            ${{ steps.out.outputs.aab }}
          if-no-files-found: error
      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.out.outputs.apk }}" "${{ steps.out.outputs.aab }}" \
            --verify-tag \
            --title "Bolid Tester $GITHUB_REF_NAME" \
            --generate-notes

  # OTA: the same JS that went into the tag's APK, published so installed builds with the same
  # runtime version (= expo.version) pick up later JS-only hotfixes from this branch. Skipped with a
  # warning until the owner has run `eas init` / `eas update:configure` and added EXPO_TOKEN.
  ota-publish:
    needs: build-android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Publish EAS Update (production branch)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The OTA bundle must carry the same DSN as the APK, or an update would silently turn
          # crash reporting into a no-op (plan 31).
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set; skipping the OTA publish (docs/release.md)."
            exit 0
          fi
          if grep -q 'TODO-eas-project-id' app.json; then
            echo "::warning::app.json still has the placeholder EAS project; run eas init + eas update:configure first (docs/release.md)."
            exit 0
          fi
          npx --yes eas-cli update --branch production --message "$GITHUB_REF_NAME" --non-interactive
